<!doctype html><meta charset="utf-8"><title>Publish</title>
<style>
  #publish-banner { display: block; padding: 8px; background: #e6ffe6; }
  .collapsed { height: 0; overflow: hidden; visibility: hidden; }
</style>
<h1>Publish</h1>
<button id="publish" data-testid="publish">Publish</button>
<p id="publish-banner" class="collapsed">Published</p>
<script>
  document.getElementById('publish').addEventListener('click', function () {
    // Seeded defect: the class is never removed, so the confirmation stays
    // collapsed. The element is in the DOM, has no `hidden` attribute and no
    // inline style — only a stylesheet rule hides it, which is precisely what a
    // DOM without layout cannot see.
  });
</script>
